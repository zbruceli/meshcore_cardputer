; MeshCore standalone client for M5Stack Cardputer-Adv + Cap LoRa-1262

[env:cardputer_adv_lora1262]
platform = platformio/espressif32@6.11.0   ; same as MeshCore [esp32_base]
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
monitor_filters = esp32_exception_decoder
board_build.partitions = default_8MB.csv
board_build.filesystem = spiffs
build_flags =
  -w -DNDEBUG
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D ESP32_PLATFORM
  -I src                                                         ; MeshCore includes <target.h>
  -I .pio/libdeps/cardputer_adv_lora1262/MeshCore/lib/ed25519   ; MeshCore needs its bundled ed25519 headers
  ; MeshCore / RadioLib
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  -D USE_SX1262
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  ; LORA_* are only the power-on defaults; real params come from the region preset
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D LORA_TX_POWER=22
  -D MAX_LORA_TX_POWER=22
  ; Cap LoRa-1262 (SX1262, TCXO, DIO2 drives the RF switch)
  -D P_LORA_NSS=5
  -D P_LORA_DIO_1=4
  -D P_LORA_RESET=3
  -D P_LORA_BUSY=6
  -D P_LORA_SCLK=40
  -D P_LORA_MOSI=14
  -D P_LORA_MISO=39
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=3.3
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  ; Cardputer-Adv
  -D PIN_VBAT_READ=10
  -D PIN_USER_BTN=0
  -D PIN_SD_CS=12
  -D PIN_BOARD_SDA=2   ; Arduino Wire on the Grove port; internal I2C (G8/G9) belongs to M5Unified
  -D PIN_BOARD_SCL=1
  ; Cap LoRa-1262 GPS (ATGM336H-6N, 115200 8N1): used only for the clock for now
  -D PIN_GPS_RX=15
  -D PIN_GPS_TX=13
lib_deps =
  SPI
  Wire
  MeshCore=https://github.com/meshcore-dev/MeshCore.git#81dbae592ffad40b4212bc0b37e82b38da08f4bc
  jgromes/RadioLib @ 7.8.1
  ed25519   ; local shim, see lib/ed25519/library.json
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
  densaugeo/base64 @ ~1.4.0
  m5stack/M5Cardputer @ ^1.1.0
